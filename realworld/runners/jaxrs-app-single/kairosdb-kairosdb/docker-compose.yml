name: kairosdb

services:
  app:
    image: eclipse-temurin:17-jdk
    container_name: kairosdb-app
    working_dir: /project
    volumes:
      - ./:/project
      - kairosdb_cache:/root/.ivy2
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/api/v1/version || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 120s
    command:
      - bash
      - -c
      - |
        set -e
        apt-get update -qq && apt-get install -y -qq curl > /dev/null 2>&1
        export CLASSPATH=tools/tablesaw-1.3.0.jar
        java make package
        tar xf build/kairosdb-*.tar -C /opt
        exec /opt/kairosdb/bin/kairosdb.sh run

volumes:
  kairosdb_cache:
