
lifecycle:
  up: |
    docker run --rm -v "$PWD":/workspace -w /workspace -v runner-driver-m2:/root/.m2 maven:3.9-eclipse-temurin-21 mvn -B -DskipTests -pl eno-ws -am package
    docker compose up -d --wait --build
  down: |
    docker compose down -v

wait:
  urls:
    - http://localhost:8080/
  timeout_seconds: 120
