name: ruoqus

services:
  app:
    image: maven:3.9-eclipse-temurin-17
    container_name: ruoqus-app
    working_dir: /project
    volumes:
      - ./:/project
      - maven_cache:/root/.m2
    ports:
      - "8080:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/login -X POST -H 'Content-Type: application/json' -d '{\"username\":\"ry\",\"password\":\"admin123\"}' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 60s
    command:
      - bash
      - -c
      - |
        set -e
        apt-get update -qq && apt-get install -y -qq curl > /dev/null 2>&1
        mvn -q -DskipTests package
        exec java -jar target/ruoyi-quarkus-1.0.0-SNAPSHOT-runner.jar

volumes:
  maven_cache:
