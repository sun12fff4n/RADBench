name: structurizr-to-png

services:
  app:
    image: maven:3.9-eclipse-temurin-21
    container_name: structurizr-to-png-app
    working_dir: /project
    volumes:
      - ./:/project
      - maven_cache:/root/.m2
    ports:
      - "8080:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/index.html || [ $$? -eq 22 ]"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 30s
    command:
      - bash
      - -c
      - |
        set -e
        apt-get update -qq && apt-get install -y -qq graphviz curl > /dev/null 2>&1
        mvn -q -DskipTests package
        exec java -cp "target/structurizr-to-png.jar:target/lib/*" \
          com.extendaretail.dsl2png.cli.ClientApp --watch --path "demo.dsl"

volumes:
  maven_cache:
